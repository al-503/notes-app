<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Voix → Contenu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Voix → Contenu</h1>
    <p class="subtitle">Génération locale, déclenchée à la main, sur ton abonnement Claude.</p>
  </header>

  <section id="folders-section" class="folders-section hidden">
    <h2 class="section-title">Combiner un sujet</h2>
    <p class="subtitle">Dossiers avec plusieurs notes : génère un seul contenu à partir de toutes.</p>
    <div id="folders-list"></div>
  </section>

  <main id="notes-list"><p class="loading">Chargement des notes…</p></main>

  <div id="result-overlay" class="overlay hidden">
    <div class="result-panel">
      <div class="result-header">
        <h2 id="result-title"></h2>
        <button id="close-result" class="icon-button" aria-label="Fermer">✕</button>
      </div>
      <div id="result-status"></div>
      <textarea id="result-text" readonly></textarea>
      <div class="result-actions">
        <button id="copy-result" class="primary">Copier</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
